services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: prolog
      POSTGRES_PASSWORD: prolog
      POSTGRES_DB: prolog
    # 호스트 5433 — 로컬 PostgreSQL 15 가 5432 를 쓰고 있다. 컨테이너 안은 그대로 5432.
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prolog"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7
    ports: ["6380:6379"]
  # SQS 호환 큐. localstack 대신 elasticmq — 가볍고 API 가 같아 AWS 로 옮겨도 코드가 안 바뀐다.
  elasticmq:
    image: softwaremill/elasticmq-native:1.6.11
    ports: ["9324:9324"]

volumes:
  pgdata:
