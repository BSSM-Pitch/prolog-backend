name: Deploy backend

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: prolog-backend-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: "030464389728"
  AWS_ROLE_ARN: arn:aws:iam::030464389728:role/prolog-github-backend-deploy
  EC2_INSTANCE_ID: i-064d924fb7a6eb9e8

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate production image
        run: docker build --tag prolog-backend:ci .

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Deploy through Systems Manager
        shell: bash
        run: |
          parameters="$(jq -nc \
            --arg sha "$GITHUB_SHA" \
            '{commands: [
              "set -eu",
              "cd /opt/prolog",
              ("git fetch --depth=1 origin " + $sha),
              ("git checkout --force " + $sha),
              "docker compose -p prolog -f compose.prod.yml config --quiet",
              "docker compose -p prolog -f compose.prod.yml build api",
              "docker compose -p prolog -f compose.prod.yml run --rm migrate",
              "docker compose -p prolog -f compose.prod.yml up -d --no-build --no-deps --force-recreate api outbox-worker notifier-worker extractor-worker ai-worker sweeper-worker caddy",
              "curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1/v1/health",
              "docker compose -p prolog -f compose.prod.yml ps",
              "docker image prune --force"
            ]}')"

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy backend ${GITHUB_SHA}" \
            --timeout-seconds 1800 \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"

          exit_code=1
          for _ in {1..360}; do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                exit_code=0
                break
                ;;
              Failed|Cancelled|TimedOut)
                break
                ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

          exit "$exit_code"
